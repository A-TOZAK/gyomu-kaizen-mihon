<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base target="_top">
<title>案件管理アプリ（見本）</title>
<meta name="robots" content="noindex">
<style>
:root{
  --ink:#1f2328; --paper:#ffffff; --wash:#f4f5f7; --line:#dfe2e6; --sub:#555c64;
  --key:#1f4e79; --key-wash:#e7eef6;
  --done:#c8322b;                        /* 済んだ印の赤 */
  --sat:#1d5fd6; --sat-wash:#edf3fe;     /* 土曜は青 */
  --sun:#c8322b; --sun-wash:#fdeeee;     /* 日曜は赤 */
  --font:"Hiragino UD Sans StdN","Hiragino Sans","BIZ UDPGothic","Noto Sans JP","Yu Gothic",sans-serif;
  --num:"DIN Alternate","Bahnschrift","Arial Narrow",sans-serif;
  --W:30px; --L:230px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);color:var(--ink);background:var(--wash);font-size:15px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--key)}
.num{font-family:var(--num)}

/* 上の帯 */
header{position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:2px solid var(--ink)}
.top{display:flex;align-items:center;gap:14px;padding:8px 20px;max-width:1360px;margin:0 auto}
.top h1{font-size:18px;white-space:nowrap}
.counts{display:flex;gap:12px;font-size:12.5px;color:var(--sub);white-space:nowrap}
.counts b{font-family:var(--num);font-size:22px;color:var(--ink);margin-right:3px;vertical-align:-2px}
.counts .alert b{color:var(--done)}
.tabs{margin-left:auto;display:flex;gap:4px}
.tabs button{border:none;background:none;padding:8px 12px;min-height:40px;cursor:pointer;color:var(--sub);border-radius:4px;white-space:nowrap;font-size:15px}
.tabs button.on{background:var(--ink);color:#fff;font-weight:700}
.bar2{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:6px 20px 10px;max-width:1360px;margin:0 auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--paper)}
.seg button{border:none;background:none;padding:5px 12px;min-height:36px;cursor:pointer;font-size:14px;white-space:nowrap}
.seg button + button{border-left:1px solid var(--line)}
.seg button.on{background:var(--key);color:#fff;font-weight:700}
.lbl{font-size:12.5px;color:var(--sub)}
.bar2 select,.bar2 input{border:1px solid var(--line);border-radius:6px;padding:5px 8px;min-height:36px;font-size:14px;background:var(--paper)}
.bar2 input[type=search]{width:180px}
.chk{font-size:13.5px;display:inline-flex;gap:6px;align-items:center;cursor:pointer;white-space:nowrap}

main{max-width:1360px;margin:0 auto;padding:14px 20px 80px}
.empty{padding:36px;text-align:center;color:var(--sub)}
.who{display:inline-block;border:1px solid var(--ink);border-radius:999px;padding:0 9px;font-size:12.5px;line-height:20px;white-space:nowrap;background:var(--paper);justify-self:start}
.who.none{border-style:dashed;color:var(--sub)}
.btn{border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:6px;padding:8px 18px;min-height:44px;cursor:pointer;font-weight:700;font-size:15px}
.btn.sub{background:var(--paper);color:var(--ink);font-weight:400}
.btn.key{background:var(--key);border-color:var(--key)}
.btn:disabled{opacity:.35;cursor:default}
.btn.small{min-height:36px;padding:4px 12px;font-size:13.5px}

/* やること（担当者ごと・日付ごと） */
.group{margin-bottom:18px}
.group h3{font-size:14.5px;margin:0 0 6px 4px;display:flex;align-items:baseline;gap:8px}
.group h3 .n{font-family:var(--num);font-size:16px;color:var(--sub);font-weight:500}
.group h3.late{color:var(--done)}
.rows{background:var(--paper);border:1px solid var(--line);border-radius:8px}
.trow{display:grid;grid-template-columns:48px 1fr 110px 118px;gap:4px 12px;align-items:center;padding:6px 12px 6px 6px;border-top:1px solid var(--wash);cursor:pointer}
.trow:first-child{border-top:none}
.trow:hover{background:#fafbfc}
.tick{width:36px;height:36px;margin:4px;border:2px solid var(--ink);border-radius:6px;background:var(--paper);cursor:pointer;font-size:22px;line-height:30px;color:var(--done);font-weight:700;flex:none}
.tname{font-weight:700;font-size:15px}
.trow.ok .tname{color:var(--sub);font-weight:400;text-decoration:line-through}
.tsub{font-size:12.5px;color:var(--sub);display:flex;flex-wrap:wrap;gap:2px 8px}
.tsub .cid{font-family:var(--num);color:var(--ink);margin-right:6px}
.tsub a{white-space:nowrap}
.when{font-family:var(--num);font-size:14px;text-align:right;white-space:nowrap}
.when.late{color:var(--done);font-weight:700}
.when small{font-family:var(--font);font-size:11.5px;display:block;color:var(--done);font-weight:400}

/* 案件の一覧 */
.addcase{margin-bottom:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.mikomi{display:inline-block;border:1px solid #c8322b;color:#c8322b;background:#fff5f4;border-radius:4px;padding:0 6px;font-size:12px;margin-left:8px;font-weight:700;vertical-align:middle}
.mikomi-note{margin:6px 0 0;font-size:13px;color:#c8322b}
.cards{display:flex;flex-direction:column;gap:10px}
.card{display:grid;grid-template-columns:110px 1fr 250px 118px;gap:6px 18px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:12px 16px;cursor:pointer;text-align:left;width:100%}
.card:hover{border-color:var(--key)}
.card .id{font-family:var(--num);font-size:20px;font-weight:700;line-height:1.2}
.card .kubun{font-size:12.5px;color:var(--sub)}
.card .where{font-weight:700;font-size:15.5px}
.card .now{font-size:13.5px;margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.card .now .k{font-size:12px;color:var(--sub)}
.card .right{text-align:right;font-size:13px;color:var(--sub)}
.card .right b{font-family:var(--num);font-size:18px;color:var(--ink);margin-right:2px}
.card .right .late b{color:var(--done)}
.hold{display:inline-block;border:1px dashed var(--sub);color:var(--sub);border-radius:4px;padding:0 6px;font-size:12px;margin-left:6px;font-weight:400}

/* 段階の帯 */
.stages{display:flex;gap:3px}
.stages span{flex:1;height:8px;border-radius:2px;background:var(--line)}
.stages span.on{background:var(--key)}
.stages span.cur{background:var(--key);box-shadow:0 0 0 2px var(--paper),0 0 0 3px var(--key)}
.stage-name{font-size:13px;margin-top:4px;font-weight:700}
.stage-name small{font-weight:400;color:var(--sub);margin-left:6px}

/* 工程表 */
.gantt{background:var(--paper);border:1px solid var(--line);border-radius:8px;overflow-x:auto;position:relative}
.g-inner{position:relative;min-width:max-content}
.g-row{display:flex;position:relative;z-index:1;min-height:34px;border-bottom:1px solid #eef0f2}
.g-label{position:sticky;left:0;z-index:3;width:var(--L);min-width:var(--L);background:var(--paper);padding:6px 10px;font-size:13px;border-right:1px solid var(--line);display:flex;gap:6px;align-items:center;justify-content:space-between;cursor:pointer}
.g-label .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g-label.done .t{color:var(--sub);text-decoration:line-through}
.g-track{position:relative;flex:none}
.g-head{position:sticky;top:0;z-index:4;background:var(--paper);border-bottom:1px solid var(--line)}
.g-head .g-label{font-size:12px;color:var(--sub);cursor:default}
.g-day{position:absolute;top:0;text-align:center;font-size:11px;line-height:1.3;color:var(--sub);padding-top:3px}
.g-day b{display:block;font-family:var(--num);font-size:14px;color:var(--ink);font-weight:500}
.g-day.sat,.g-day.sat b{color:var(--sat)}
.g-day.sun,.g-day.sun b{color:var(--sun)}
.g-day.today b{color:#fff;background:var(--key);border-radius:4px;margin:0 3px}
.g-case{background:var(--wash)}
.g-case .g-label{background:var(--wash);font-weight:700;font-size:13.5px;justify-content:flex-start}
.g-case .g-label .num{font-size:15px}
.g-where{position:sticky;left:calc(var(--L) + 8px);display:inline-block;padding-top:7px;font-size:12.5px;color:var(--sub);white-space:nowrap;z-index:2}
.bar{position:absolute;top:7px;height:20px;border-radius:4px;background:var(--key);color:#fff;font-size:11.5px;line-height:20px;padding:0 6px;white-space:nowrap;overflow:hidden;cursor:pointer}
.bar.done{background:#c9ced4;color:var(--ink)}
.bar.late{background:var(--paper);border:2px solid var(--done);color:var(--done);line-height:16px;font-weight:700}
.bar-name{position:absolute;top:8px;font-size:11.5px;line-height:18px;white-space:nowrap;color:var(--ink)}
.bar-name.done{color:var(--sub)}
.bar-name.late{color:var(--done);font-weight:700}
.bar.due{top:4px;height:26px;width:4px!important;padding:0;background:var(--ink);border-radius:1px}
.g-bg{position:absolute;top:0;bottom:0;z-index:0;pointer-events:none}
.g-bg.sat{background:var(--sat-wash)}
.g-bg.sun{background:var(--sun-wash)}
.g-bg.today{background:var(--key-wash)}
.g-bg.todayline{width:2px!important;background:var(--key);opacity:.6}
.g-bg.blk{border-left:1px solid #e6e8eb}
.g-note{font-size:12.5px;color:var(--sub);margin-top:8px;display:flex;gap:16px;flex-wrap:wrap}
.g-note i{display:inline-block;width:18px;height:10px;border-radius:2px;margin-right:4px}

/* 案件の画面 */
.back{border:none;background:none;color:var(--key);cursor:pointer;padding:6px 0;min-height:40px;margin-bottom:6px;font-size:14.5px}
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:18px 20px;margin-bottom:14px}
.sheet h2{font-size:16px;margin-bottom:4px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sheet .lead{font-size:13px;color:var(--sub);margin-bottom:10px}
.sheet h2 .btn{margin-left:auto}
.head1{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.head1 .id{font-family:var(--num);font-size:30px;font-weight:700;line-height:1.1}
.head1 .where{font-size:19px;font-weight:700}
.head2{font-size:13.5px;color:var(--sub);margin-top:6px;display:flex;gap:6px 16px;flex-wrap:wrap;align-items:center}
.stepper{display:grid;grid-template-columns:repeat(8,1fr);gap:10px;margin:18px 0 16px}
.stepper > div{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:10px 6px 12px!important;font-size:14px;line-height:1.4}
.stepper > div small{margin:0;line-height:1.5}
.stepper > div .ow{margin:2px 0 0!important}
.who{margin-left:8px}
.go-h h3,.stagebox h3,.sheet h2{gap:10px}
.ic{width:56px;height:56px;border-radius:8px;object-fit:cover;flex:none;background:#fff;display:block}
.ic.s{width:36px;height:36px;border-radius:6px}
.ic.l{width:72px;height:72px}
.stepper .ic{width:72px;height:72px;margin:0 0 4px;opacity:.45;filter:grayscale(1)}
.stepper div.on .ic{opacity:1;filter:none}
.stepper div.cur .ic{outline:3px solid var(--key);outline-offset:2px}
.bigl a,.bigl span{flex-direction:row!important;align-items:center;gap:14px}
.bigl a .bt,.bigl span .bt{display:flex;flex-direction:column;border:none!important;background:none!important;padding:0!important;min-height:0!important;color:inherit!important}
.photo{gap:12px}
.trow.has-ic{grid-template-columns:48px 40px 1fr 110px 118px}
.stepper div .ow{display:inline-block;margin-top:3px;border:1px solid var(--line);border-radius:999px;padding:0 7px;font-size:11.5px;color:var(--ink);background:var(--paper)}
.stepper div.cur .ow{border-color:var(--key);color:var(--key);font-weight:700}
@media(max-width:760px){.stepper{grid-template-columns:repeat(4,1fr)}}
.stepper div{border-top:6px solid var(--line);padding-top:6px;font-size:13px;color:var(--sub)}
.stepper div.on{border-color:var(--key);color:var(--ink)}
.stepper div.cur{font-weight:700;color:var(--key)}
.stepper div small{display:block;font-size:11.5px;font-weight:400;color:var(--sub);line-height:1.4}
.stage-act{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.editor{border:2px solid var(--key);border-radius:8px;padding:14px;margin:8px;background:#fbfcfe}
.form{display:grid;grid-template-columns:8em 1fr;gap:10px 12px;align-items:center;font-size:14.5px}
.form label{color:var(--sub);font-size:13.5px}
.form label em{color:var(--done);font-style:normal;margin-left:2px}
.form input,.form select,.form textarea{border:1px solid #c5cad0;border-radius:6px;padding:7px 10px;min-height:40px;width:100%;background:var(--paper)}
.form textarea{min-height:70px;resize:vertical}
.form .two{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.form .two input{flex:1;min-width:130px}
.acts{margin-top:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.acts .del{margin-left:auto;border:none;background:none;color:var(--done);cursor:pointer;min-height:40px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a{border:1px solid var(--line);border-radius:6px;padding:9px 14px;text-decoration:none;font-size:14.5px;background:var(--paper);min-height:44px}
.links a:hover{border-color:var(--key)}
.links .none{color:var(--sub);font-size:13.5px;padding:8px 0}
.checks{list-style:none}
.checks li{display:grid;grid-template-columns:48px 22px 1fr 120px;gap:4px 8px;padding:8px 0;border-top:1px solid var(--wash);align-items:start}
.checks li:first-child{border-top:none}
.checks .star{color:var(--key);font-weight:700;padding-top:10px}
.checks .what{font-weight:700;padding-top:8px}
.checks .why{font-size:13px;color:var(--sub);margin-top:2px}
.checks .by{font-size:12px;color:var(--done);margin-top:2px}
.checks .place{font-size:12.5px;color:var(--sub);padding-top:10px;text-align:right}
.checks li.ok .what{color:var(--sub);font-weight:400}
/* 人の確認：行く先ごとのカード（2026-09-29 本人「やることがいっぱいあるだけに見える」） */
.gos{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
.go-窓口{grid-row:span 2}
.go h4{font-size:13.5px;color:var(--key);margin:10px 0 0;padding-top:8px;border-top:2px solid var(--key-wash)}
/* 報告書の進み具合 */
.secs{display:flex;flex-direction:column;gap:6px}
.sec{border:1px solid var(--line);border-radius:8px;background:var(--paper)}
.sec summary{padding:10px 14px;cursor:pointer;min-height:48px;list-style:none}
.sec .sh{display:grid;grid-template-columns:11em 1fr auto;gap:12px;align-items:center}
.sec summary::-webkit-details-marker{display:none}
.sec .sn::before{content:'▸ ';color:var(--sub)}
.sec[open] .sn::before{content:'▾ '}
.sec .sn{font-weight:700;font-size:14.5px}
.sec .pbar{height:10px;background:var(--wash);border-radius:5px;overflow:hidden}
.sec .pbar i{display:block;height:100%;background:var(--key)}
.sec .sc{font-size:12.5px;color:var(--sub);white-space:nowrap;display:flex;gap:8px;align-items:baseline}
.sec .sc b{font-family:var(--num);font-size:17px;color:var(--ink)}
.sec .sc em{font-style:normal;border:1px solid var(--line);border-radius:999px;padding:0 7px;color:var(--ink)}
.ftab{width:100%;border-collapse:collapse;font-size:13.5px;margin:0 0 6px}
.ftab th,.ftab td{border-top:1px solid var(--wash);padding:6px 14px;text-align:left;vertical-align:top}
.ftab th{font-weight:400;color:var(--sub);width:13em}
.ftab td.fs{width:10em;white-space:nowrap}
.ftab small{display:block;font-size:11.5px;color:var(--sub);white-space:normal}
.chip{display:inline-block;border-radius:999px;padding:0 8px;font-size:12px;line-height:20px;border:1px solid var(--line)}
.chip.k-済{color:var(--done);border-color:var(--done)}
.chip.k-窓口,.sec em.k-窓口{background:var(--key);color:#fff;border-color:var(--key)}
.go .place{font-size:12px;color:var(--key);font-weight:700;padding-top:9px}
.go .place + .q{padding-top:0}
.go .qn{font-family:var(--num);font-size:12px;color:var(--sub);font-weight:400;margin-right:6px}
.go .cols{font-size:12px;color:var(--sub);margin-top:3px}
.go .col{display:inline-block;border:1px solid var(--line);border-radius:4px;padding:0 5px;margin:2px 3px 0 0;color:var(--ink);background:var(--wash)}
/* 案件の画面の一番上：ファイルとフォルダをすぐ開く */
.bigl{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0 4px}
.minil{font-size:13px;margin:4px 0 0;display:flex;gap:14px;flex-wrap:wrap}
.minil .lbl{font-size:12.5px}
.photo{display:inline-flex;align-items:center;min-height:44px;padding:8px 16px;border:2px solid var(--key);border-radius:8px;background:var(--key-wash);color:var(--key);font-weight:700;text-decoration:none;margin:4px 0 10px}
.stagebox{border-left:4px solid var(--key);border-radius:0;padding:4px 0 4px 14px;margin:6px 0 14px}
.stagebox.later{border-left-color:var(--line)}
.kyoka{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
.kyoka h4{font-size:14.5px;margin-bottom:4px}
.kyoka .kouho{font-weight:700;margin:4px 0 8px}
.stagebox h3{font-size:15.5px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.stagebox h3 .cnt{margin-left:auto;font-size:12.5px;color:var(--sub);font-weight:400}
.stagebox h3 .cnt b{font-family:var(--num);font-size:18px;color:var(--ink);margin-right:2px}
.bigl a,.bigl span{display:flex;flex-direction:column;justify-content:center;min-height:64px;padding:10px 14px;border:2px solid var(--key);border-radius:8px;background:var(--key-wash);text-decoration:none;font-weight:700;font-size:15.5px;color:var(--key)}
.bigl a small,.bigl span small{font-weight:400;font-size:12px;color:var(--sub)}
.bigl a:hover{background:#dbe6f2}
.bigl span{border-style:dashed;border-color:var(--line);background:var(--paper);color:var(--sub)}
.topinfo{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.topinfo h3{font-size:14px;display:flex;align-items:center;gap:10px;margin-bottom:6px}
.topinfo h3 .btn{margin-left:auto}
dl.info.cols{grid-template-columns:7em 1fr 7em 1fr}
.go{border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:var(--paper)}
.go.all{background:var(--wash)}
.go-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.go-h h3{font-size:15.5px}
.go-h .cnt{margin-left:auto;font-size:12.5px;color:var(--sub);white-space:nowrap}
.go-h .cnt b{font-family:var(--num);font-size:18px;color:var(--ink);margin-right:2px}
.go.all .go-h .cnt b{color:var(--done)}
.go-sub{font-size:12.5px;color:var(--sub);margin:2px 0 8px}
.go ul{list-style:none}
.go li{display:grid;grid-template-columns:44px 1fr;gap:2px 8px;padding:8px 0;border-top:1px solid var(--wash);align-items:start}
.go li .q{font-weight:700;font-size:14.5px;padding-top:9px}
.go li .q .st{color:var(--key);margin-right:3px}
.go li .now{font-size:12.5px;color:var(--sub);margin-top:1px}
.go li .ans{font-size:13.5px;margin-top:4px;padding:4px 8px;border-left:3px solid var(--done);background:#fdf7f6;white-space:pre-wrap}
.go li .write{border:1px dashed #b9c0c8;background:none;border-radius:6px;padding:4px 10px;min-height:34px;margin-top:5px;cursor:pointer;font-size:13px;color:var(--key)}
.go li.ok .q{color:var(--sub);font-weight:400}
.go li.ok .now{display:none}
.go .by{font-size:12px;color:var(--done);margin-top:2px}
.form .cdone{grid-column:2;font-size:14.5px;color:var(--ink)}
.form .cdone input{width:22px;height:22px;min-height:0}
.log{list-style:none;font-size:13px}
.log li{padding:5px 0;border-top:1px solid var(--wash);display:grid;grid-template-columns:120px 90px 1fr;gap:8px}
.log li:first-child{border-top:none}
.log .t{font-family:var(--num);color:var(--sub)}
.log .w{color:var(--sub)}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50;max-width:90vw}
.toast.on{opacity:1}

/* 試し版：本物の Code.gs を、偽のGoogleの上で動かす */
/**
 * 偽のGoogle（2026-09-28）。Code.gs を手を入れずに、Node とブラウザで動かすためのもの。
 * スプレッドシート・ドライブ・メール・プロパティ・ロックを、メモリの中だけでまねる。
 * 本物と違うところ：書式や入力規則は記録するだけ。値はすべて文字として持つ（Code.gs が「書式なしテキスト」にしている前提）。
 */
(function (root) {
  function makeFakeGas(opts) {
    opts = opts || {};
    const S = {
      now: opts.now ? new Date(opts.now) : null,
      user: opts.user === undefined ? 'owner@example.com' : opts.user,
      owner: opts.owner || 'owner@example.com',
      props: Object.assign({}, opts.props || {}),
      outbox: [],
      logs: [],
      trashed: [],
      idn: 0,
    };
    const nid = p => p + (++S.idn);

    // ── スプレッドシート ──
    function Sheet(name) {
      this.name = name;
      this.cells = [];          // cells[r][c]（0始まり）
      this.maxRows = 1000;
      this.formats = {};
    }
    Sheet.prototype.getName = function () { return this.name; };
    Sheet.prototype.getMaxRows = function () { return this.maxRows; };
    Sheet.prototype.getLastRow = function () {
      for (let r = this.cells.length - 1; r >= 0; r--) {
        if ((this.cells[r] || []).some(v => v !== '' && v !== undefined && v !== null)) return r + 1;
      }
      return 0;
    };
    Sheet.prototype.insertRowsAfter = function (after, n) { this.maxRows += n; return this; };
    Sheet.prototype.deleteRow = function (r) {
      if (r < 1 || r > this.maxRows) throw new Error('deleteRow: 範囲の外 ' + r);
      this.cells.splice(r - 1, 1);
      this.maxRows -= 1;
      return this;
    };
    Sheet.prototype.setFrozenRows = function () { return this; };
    Sheet.prototype.setFrozenColumns = function () { return this; };
    Sheet.prototype.getRange = function (r, c, nr, nc) {
      if (typeof r !== 'number') throw new Error('getRange: 数で指定してください（偽のGoogle）');
      nr = nr || 1; nc = nc || 1;
      if (r < 1 || c < 1 || nr < 1 || nc < 1) throw new Error('getRange: 範囲が正しくありません');
      if (r + nr - 1 > this.maxRows) throw new Error('getRange: 行が足りません（' + (r + nr - 1) + ' > ' + this.maxRows + '）');
      return new Range(this, r, c, nr, nc);
    };
    function Range(sh, r, c, nr, nc) { Object.assign(this, { sh, r, c, nr, nc }); }
    const chain = function () { return this; };
    ['setNumberFormat', 'setFontWeight', 'setBackground', 'setFontColor', 'setDataValidation'].forEach(m => { Range.prototype[m] = chain; });
    Range.prototype.setValues = function (vals) {
      if (vals.length !== this.nr || vals.some(row => row.length !== this.nc)) {
        throw new Error('setValues: 行と列の数が範囲と合いません（' + vals.length + '×' + (vals[0] || []).length + ' と ' + this.nr + '×' + this.nc + '）');
      }
      for (let i = 0; i < this.nr; i++) {
        const row = this.sh.cells[this.r - 1 + i] = this.sh.cells[this.r - 1 + i] || [];
        for (let j = 0; j < this.nc; j++) {
          const v = vals[i][j];
          row[this.c - 1 + j] = v === null || v === undefined ? '' : String(v);
        }
      }
      return this;
    };
    Range.prototype.getDisplayValues = function () {
      const out = [];
      for (let i = 0; i < this.nr; i++) {
        const row = this.sh.cells[this.r - 1 + i] || [];
        const o = [];
        for (let j = 0; j < this.nc; j++) o.push(row[this.c - 1 + j] === undefined ? '' : row[this.c - 1 + j]);
        out.push(o);
      }
      return out;
    };
    Range.prototype.getValues = Range.prototype.getDisplayValues;
    // リンクつきの文字（2026-10-02 照合表の根拠にリンクを書く試験のため）。文字はセルに、リンクは sh.links に残す
    Range.prototype.setRichTextValue = function (v) {
      const row = this.sh.cells[this.r - 1] = this.sh.cells[this.r - 1] || [];
      row[this.c - 1] = v.text;
      this.sh.links = this.sh.links || {};
      this.sh.links[this.r + ',' + this.c] = v.url;
      return this;
    };
    Sheet.prototype.getDataRange = function () {
      const nr = Math.max(1, this.getLastRow());
      const nc = Math.max(1, ...Array.from(this.cells, r => (r || []).length));   // 穴のある配列でも数える
      return new Range(this, 1, 1, nr, nc);
    };

    const book = { id: nid('ss'), sheets: [new Sheet('シート1')] };
    const Spreadsheet = {
      getId: () => book.id,
      getSheetByName: n => book.sheets.find(s => s.name === n) || null,
      getSheets: () => book.sheets.slice(),
      insertSheet: n => {
        if (book.sheets.some(s => s.name === n)) throw new Error('同じ名前のシートがあります：' + n);
        const s = new Sheet(n); book.sheets.push(s); return s;
      },
      deleteSheet: s => { book.sheets = book.sheets.filter(x => x !== s); },
    };
    const SpreadsheetApp = {
      getActiveSpreadsheet: () => Spreadsheet,
      openById: () => Spreadsheet,
      newRichTextValue: () => {
        const v = { text: '', url: '' };
        const b = { setText: t => { v.text = t; return b; }, setLinkUrl: u => { v.url = u; return b; }, build: () => v };
        return b;
      },
      newDataValidation: () => {
        const b = { requireValueInList: () => b, setAllowInvalid: () => b, build: () => ({}) };
        return b;
      },
    };

    // ── ドライブ ──
    const files = {};
    function iter(list) { let i = 0; return { hasNext: () => i < list.length, next: () => list[i++] }; }
    function Folder(name, parent) {
      this.id = nid('fo'); this.name = name; this.parent = parent; this.children = []; this.files = [];
      files[this.id] = this;
    }
    Folder.prototype.getId = function () { return this.id; };
    Folder.prototype.getName = function () { return this.name; };
    Folder.prototype.getUrl = function () { return 'https://drive.google.com/drive/folders/' + this.id; };
    Folder.prototype.createFolder = function (n) { const f = new Folder(n, this); this.children.push(f); return f; };
    Folder.prototype.getFolders = function () { return iter(this.children.slice()); };
    Folder.prototype.getFoldersByName = function (n) { return iter(this.children.filter(f => f.name === n)); };
    Folder.prototype.getFilesByName = function (n) { return iter(this.files.filter(f => f.name === n && !f.trashed)); };
    Folder.prototype.createFile = function (blob) {
      const f = { id: nid('fi'), name: blob.name, mime: blob.mime, bytes: blob.bytes, trashed: false };
      f.getId = () => f.id; f.getName = () => f.name;
      f.getUrl = () => 'https://drive.google.com/file/d/' + f.id + '/view';
      f.setTrashed = t => { f.trashed = !!t; if (t) S.trashed.push(f.name); return f; };
      this.files.push(f); files[f.id] = f; return f;
    };
    const rootF = new Folder('マイドライブ', null);
    const DriveApp = {
      getRootFolder: () => rootF,
      getFolderById: id => { const f = files[id]; if (!f || !(f instanceof Folder)) throw new Error('フォルダが見つかりません'); return f; },
      getFileById: id => {
        if (id === book.id) return { getParents: () => iter([rootF]) };
        const f = files[id]; if (!f) throw new Error('ファイルが見つかりません'); return f;
      },
    };

    // ── そのほか ──
    const pad = n => ('0' + n).slice(-2);
    const Utilities = {
      formatDate: (d, tz, fmt) => {
        const j = new Date(d.getTime() + 9 * 3600000);   // Asia/Tokyo 固定
        const map = { yyyy: j.getUTCFullYear(), MM: pad(j.getUTCMonth() + 1), dd: pad(j.getUTCDate()), HH: pad(j.getUTCHours()), mm: pad(j.getUTCMinutes()) };
        return fmt.replace(/yyyy|MM|dd|HH|mm/g, k => map[k]);
      },
      base64Decode: s => {
        if (typeof s !== 'string' || !/^[A-Za-z0-9+/=\s]*$/.test(s)) throw new Error('base64 として読めません');
        return typeof Buffer !== 'undefined' ? Array.from(Buffer.from(s, 'base64')) : Array.from(atob(s), c => c.charCodeAt(0));
      },
      newBlob: (bytes, mime, name) => ({ bytes, mime, name,
        getBytes: () => typeof bytes === 'string' ? Array.from(Buffer.from(bytes, 'utf8')) : bytes }),
      getUuid: () => nid('uu') + '-0000',
    };
    // xlsx を Googleスプレッドシートに変える Drive API（REST）の代役。送られた名前と置き場所で、スプレッドシートを作る
    const UrlFetchApp = {
      fetch: (url, o) => {
        S.fetched = (S.fetched || []).concat([url]);
        const text = Buffer.from(o.payload).toString('utf8');
        const meta = JSON.parse(/\{"name".*?\]\}/.exec(text)[0]);

\n  // [段階, 分類, 始まり（受付日から何日後）, 終わり（受付日から何日後）]\n  ['受付', '受付', 0, 0],\n  ['たたき台の作成', '役所調査', 0, 1],\n  ['人の目で確認', '役所調査', 1, 2],\n  ['窓口で確認', '役所調査', 2, 4],\n  ['現地調査', '現地調査', 5, 5],\n  ['最終チェック', '報告と納品', 6, 6],\n  ['報告書の納品', '報告と納品', 7, 7],\n];\nfunction addDays_(ymd, n) {\n  const m = /^(\\d{4})-(\\d{2})-(\\d{2})/.exec(String(ymd || ''));\n  const d = m ? new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3])) : new Date();\n  d.setDate(d.getDate() + n);\n  return Utilities.formatDate(d, TZ, 'yyyy-MM-dd');\n}\nfunction stageName_(v) { return String(v || '').replace(/（[^）]*）$/, '').trim(); }\n/** 敷地調査の案件のやることを、段階と同じ7行にそろえる。前の段の行は済、今の段とそれより後は済でない。\n *  人が足した行は残す。段階の行に人が直した日付・担当・メモ・リンクも残す。\n *  道具が前の形（受付・Web調査・現地調査…の7工程）で送った行があるときは、作り直す */\nfunction ensureStageTasks_(id) {\n  const row = getCase_(id);\n  if (!row || row['区分'] === '許認可') return;\n  const st = CHOICES['段階'], cur = st.indexOf(stageFix_(row['段階']));\n  const mine = readAll_('やること').filter(r => r['案件番号'] === id);\n  const tool = mine.filter(r => r['足した人'] === BY_TOOL);\n  const fresh = tool.some(r => st.indexOf(stageName_(r['やること'])) < 0);\n  const before = {};\n  if (!fresh) tool.forEach(r => { before[stageName_(r['やること'])] = r; });\n  const used = {};\n  mine.filter(r => r['足した人'] !== BY_TOOL).forEach(r => { used[r['番号']] = true; });\n  let next = 1;\n  const rows = STAGE_PLAN.map(([s, kind, a, z]) => {\n    const p = before[s] || {};\n    const start = p['開始日'] || addDays_(row['受付日'], a), end = p['終了日'] || addDays_(row['受付日'], z);\n    const done = st.indexOf(s) < cur;\n    let no = p['番号'] && !used[p['番号']] ? p['番号'] : '';\n    if (!no) { while (used[next]) next++; no = next; }\n    used[no] = true;\n    return {\n      '案件番号': id, '番号': no, '分類': kind, 'やること': s,\n      '担当': p['担当'] || stageOwner_(s, start), '開始日': start, '終了日': end,\n      '済': done ? 'TRUE' : 'FALSE', '済んだ日': done ? (p['済'] === 'TRUE' && p['済んだ日'] ? p['済んだ日'] : today_()) : '',\n      'メモ': p['メモ'] || '', 'リンク': p['リンク'] || '', '足した人': BY_TOOL,\n    };\n  });\n  deleteWhere_('やること', r => r['案件番号'] === id && r['足した人'] === BY_TOOL);\n  appendObjs_('やること', rows);\n}\n/** 前の形のやることを、一度だけ段階の行に入れかえる。済んだら STAGE_TASKS_FIXED に印をつける */\nfunction fixStageTasks_() {\n  const props = PropertiesService.getScriptProperties();\n  if (props.getProperty('STAGE_TASKS_FIXED') === '1') return;\n  readAll_('案件').forEach(c => { if (c['区分'] !== '許認可') ensureStageTasks_(c['案件番号']); });\n  props.setProperty('STAGE_TASKS_FIXED', '1');\n}\n\n/** 人が決める列。Claude Code が送り直しても、人が入れた値があれば上書きしない */\n// 「主担当」の列は、画面では「案件担当」（会社側で案件を受け持つ人。既定は木村）と呼ぶ（2026-10-01 本人）\n/** 案件担当の既定（2026-10-01 本人「基本的には木村で」） */\nconst CASE_OWNER = '木村';\nconst HUMAN_COLS = ['主担当', '保留', '着工予定', 'メモ'];\n/** 画面から変えてよい案件の列 */\nconst EDITABLE = ['受付日', '区分', '紹介元', '依頼者の担当', '建築主', '所在地番', '自治体', '主担当',\n                  '段階', '保留', '期日', '着工予定', '追加手続の候補', 'メモ', '見積', '請求', '入金'];\n/** 画面から変えてよい「やること」の列 */\nconst TASK_EDITABLE = ['分類', 'やること', '担当', '開始日', '終了日', '済', 'メモ', 'リンク'];\n/** ファイルのリンクを書く列 */\nconst LINK_COLS = ['報告書', '確認用リンク集', '見積書', '請求書', '役所調査ガイド'];\n/** 名前つきカメラ（撮るときに写真に名前を付けるWebのカメラ。2026-10-19 田中さんの声から木村が作った） */\nconst CAMERA_URL = 'https://a-tozak.github.io/namae-camera/';\n/** お金の列（人も画面の「直す」から書ける。Claude が書くときは action jimu） */\nconst MONEY_COLS = ['見積', '請求', '入金'];\nconst BY_TOOL = 'Claude Code';\n\n/** 標準日数の仮の値。敷地調査は uketsuke.py の STEPS と同じ。許認可の日数は田中さんに聞いて入れる */\nconst STD_SEED = [\n  ['敷地調査', 1, '受付', '受付（メールをChatworkで渡す）', '受付日', 0, '田中'],\n  ['敷地調査', 2, '役所調査', 'たたき台の作成', '受付日', 0, 'Claude Code'],\n  ['敷地調査', 3, '役所調査', '人の目で確認（照合表）', '受付日', 1, '木村。11月から中村'],\n  ['敷地調査', 4, '役所調査', '窓口で確認', '調査日', 1, '木村。11月から中村'],\n  ['敷地調査', 5, '現地調査', '現地調査', '調査日', 0, '田中。調査日がなければ受付日の5日後'],\n  ['敷地調査', 6, '報告と納品', '最終チェック', '期日', -1, '田中'],\n  ['敷地調査', 7, '報告と納品', '納品', '期日', 0, '田中'],\n  ['許認可', 1, '許認可', '事前相談と資料集め', '受任日', '', '日数は田中さんに聞いて入れる'],\n  ['許認可', 2, '許認可', '資格者の確認と申請', '', '', '行政書士法人'],\n  ['許認可', 3, '許認可', '補正の対応', '', '', ''],\n  ['許認可', 4, '報告と納品', '許可と報告', '', '', ''],\n];\n\n\n/** 手引きの最初の中身（表「手引き」が空のときに入れる。あとは表で書きかえる）。\n *  元は 20_業務マニュアル（2026-10-12）と、窓口の指示書・図面のスキル（2026-10-18、10-24） */\nconst GUIDE_SEED = [\n  ['全体', 1, '実案件の情報は外に出しません', '個人の無料のAIに図面や登記を貼りません。ドライブもLINEも個人の物を使いません。窓口には所在と地番で聞きます。'],\n  ['全体', 2, 'メールとファイルの送信は、必ず人が押します', 'Claude が作るのは下書きまでです。許認可の要否と申請は見本行政書士法人、境界と測量の判断は田中さんの事務所が決めます。'],\n  ['全体', 3, '連絡はChatworkで行います', 'この画面は「いまどこまで進んだか」と「だれがいつ動くか」を見る所です。相談や連絡はChatworkに書きます。'],\n  ['受付', 1, 'Chatworkの案件の連絡を開き、添付の資料をすべてダウンロードします', '連絡の文面はコピーして「メール.txt」という名前で保存します。名前に「メール」を入れると道具が読みます。'],\n  ['受付', 2, 'メール.txt と添付を「00_受付箱」に入れ、Claude に「新しい依頼」と言います', '案件番号のフォルダと、この画面の案件ができます。受付箱は空に戻ります。'],\n  ['受付', 3, '位置図、公図、登記簿謄本がそろっているかを見ます', '足りない物は Claude が一覧にします。登記は田中さんの事務所のアカウントで取ります。'],\n  ['受付', 4, '受付の返事は、Claude に「受付の返事を作って」と言います', 'メールの下書きができます。送るのは人です。'],\n  ['たたき台の作成', 1, 'ネットで分かることを Claude が集め、報告書と照合表を作ります', '担当した58自治体の32項目のうち、ネットで値まで取れるのは約4割、目安まで取れるのは約3割です。残りは照会、窓口、現地で確かめます。'],\n  ['たたき台の作成', 2, '人が見るのは、★の項目と「地番が見込み」の札です', '地番が見込みのときは、公図と登記で確かめるまで報告書の値は仮のものです。'],\n  ['たたき台の作成', 3, '取れなかったことと、該当しないことは分けて書きます', '取れなかったのに「該当なし」と書くのが、いちばん起きやすい誤りです。'],\n  ['人の目で確認', 1, '照合表を開き、行ごとに根拠のリンクを開いて、値が資料と合っているかを見ます', '照合表は、役所調査の報告書のスプレッドシートの1枚目です。'],\n  ['人の目で確認', 2, '合っていれば「済」のチェックを押します', '色が消えて、行が灰色になります。この画面を開くと、済の数を数え直します。'],\n  ['人の目で確認', 3, 'Claude が図面から読んだ数字は「読み」です。図面で確かめます', '福岡市と糸島市のWeb地図は古い座標の決まりです。そのまま使うと約420mずれるので、地番で照らします。'],\n  ['窓口で確認', 1, '行く人と行く日を、「窓口で聞くこと」の欄で決めます', '決めた人と日はカレンダーに出ます。'],\n  ['窓口で確認', 2, '持っていく紙は、Claude に「役所調査ガイドを作って」と言います', '窓口ごとに1枚で、館内の案内図、撮る写真、聞くことが入ります。'],\n  ['窓口で確認', 3, '伝えるのは所在と地番までです', '依頼者や所有者の名前は、求められない限り言いません。'],\n  ['窓口で確認', 4, '「適用されますか」ではなく「どう案内していますか」と聞きます', '答えた人の係と名字と日時を残します。聞けなかったことも「聞けなかった」と書きます。'],\n  ['窓口で確認', 5, '相手の了承を得てから、PLAUD NOTE で録音します', '文字起こしを案件フォルダに入れ、Claude に「窓口の答えを書き足して」と言います。'],\n  ['窓口で確認', 7, '写真は「名前つきカメラ」で撮ります', '撮るときに写真に名前を付けられます。窓口と現地の欄にあるボタンから開きます。'],\n  ['窓口で確認', 6, 'ガスと埋蔵文化財は、前の日までに照会します', 'ガス会社は地域で違います（西部ガス、筑紫ガス、近くのガス会社など）。その案件の照会先は「窓口で聞くこと」の中に出ます。'],\n  ['現地調査', 1, '測量は田中さんの事務所が行い、速報図面をChatworkで送ってくれます', ''],\n  ['現地調査', 2, '速報図面は案件フォルダの「添付」に入れ、Claude に「速報図面が届いた」と言います', '実測の面積、現況幅員、境界杭、高低差、電柱を読み、「納品前に確かめる」の印をつけます。'],\n  ['現地調査', 3, '現地の写真は「現地写真を入れる」から入れます', '写真帳は写真帳メーカーで作れます。'],\n  ['最終チェック', 1, '最終図面が届いたら、Claude に「最終図面が届いた」と言います', '速報図面との差（面積、境界の位置、高さ）を出し、「納品前に確かめる」の印を外します。'],\n  ['最終チェック', 2, '特記事項の文は、決まった文から組みます', 'Claude に自由に作文させません。'],\n  ['最終チェック', 3, '手で直した所があるときは、道具で回し直しません', '回し直すと手で直した所が消えます。Claude に書き足しを頼みます。'],\n  ['報告書の納品', 1, '窓口で聞いたその日のうちに渡すのが目標です', ''],\n  ['報告書の納品', 2, '納品のメールは、Claude に「納品のメールを作って」と言います', 'メールの下書きができます。送るのは人です。送ったら、この画面の2つの確認を済にします。'],\n  ['報告書の納品', 3, '許認可が要りそうなときは、見本行政書士法人へつなぎます', '要否を決めるのと申請は、資格者が行います。'],\n  ['完了', 1, '見積書と請求書は、Claude に「見積書を作って」「請求書を作って」と言います', '書類とメールの下書きができ、この画面の「お金」の欄に入ります。'],\n  ['完了', 2, '金額、振込先、登録番号が決まるまでは、書類に「未確定」と出ます', '未確定のまま送りません。決まったら設定のファイルに入れます。'],\n  ['完了', 3, '入金を確かめたら、Claude に「入金を確かめた」と言います', '「直す」から入金の欄に日付を書いてもかまいません。'],\n];\n\n// ─────────────────────────────────────────────\n// 入口\n// ─────────────────────────────────────────────\n\nfunction doGet() {\n  if (!isMember_()) {\n    return HtmlService.createHtmlOutput(\n      '<p style=\"font-family:sans-serif;padding:24px;line-height:1.8\">この画面は、決まった人だけが見られます。<\/p>')\n      .setTitle('案件管理');\n  }\n  // 最初のデータをページに埋めて返す。画面が開いてから取りに行く往復を1回へらす（2026-09-28）\n  const tpl = HtmlService.createTemplateFromFile('Index');\n  tpl.bootTag = '<script>window.__BOOT=' + JSON.stringify(getAll()).replace(/<\/g, '\\\\u003c') + ';<\/script>';\n  return tpl.evaluate()\n    .setTitle('案件管理')\n    .addMetaTag('viewport', 'width=device-width, initial-scale=1');\n}\n\n/** Claude Code からの受け口。合言葉が合わなければ何もしない */\nfunction doPost(e) {\n  let body;\n  try {\n    body = JSON.parse(e.postData.contents);\n  } catch (err) {\n    return json_({ ok: false, error: 'JSONが読めません' });\n  }\n  const token = PropertiesService.getScriptProperties().getProperty('TOKEN');\n  if (!token || !body || body.token !== token) return json_({ ok: false, error: '合言葉が違います' });\n  const lock = LockService.getScriptLock();\n  lock.waitLock(20000);\n  try {\n    if (body.action === 'case') return json_(receiveCase_(body));\n    if (body.action === 'file') return json_(receiveFile_(body));\n    if (body.action === 'recolor') return json_(recolor_(body));\n    if (body.action === 'links') return json_(setLinks_(body));\n    if (body.action === 'jimu') return json_(jimu_(body));\n    if (body.action === 'peek') return json_({ ok: true, case: getCase_(String(body['案件番号'] || '')) });\n    if (body.action === 'remove') return json_(removeCase_(String(body['案件番号'] || ''), BY_TOOL));\n    if (body.action === 'ping') return json_({ ok: true, sheets: Object.keys(SHEETS).map(n => sh_(n).getName()) });\n    return json_({ ok: false, error: 'action が分かりません：' + body.action });\n  } catch (err) {\n    return json_({ ok: false, error: String(err && err.message || err) });\n  } finally {\n    lock.releaseLock();\n  }\n}\n\nfunction json_(o) {\n  return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);\n}\n\n// ─────────────────────────────────────────────\n// Claude Code から受け取る\n// ─────────────────────────────────────────────\n\n/** 案件1件分：{case:{…}, tasks:[…], checks:[…], log:'…'} */\nfunction receiveCase_(b) {\n  const c = b.case || {};\n  const id = String(c['案件番号'] || '').trim();\n  if (!/^[A-Za-z0-9\\-_見本]+$/.test(id)) throw new Error('案件番号がないか、使えない文字があります：' + id);\n  if (c['段階']) c['段階'] = stageFix_(c['段階']);\n  if (c['段階'] && CHOICES['段階'].indexOf(c['段階']) < 0) throw new Error('段階が選択肢にありません：' + c['段階']);\n  const old = getCase_(id);\n  const row = Object.assign({}, old || {});\n  if (c['主担当']) c['主担当'] = nameFix_(c['主担当']);\n  Object.keys(c).forEach(k => {\n    if (SHEETS['案件'].indexOf(k) < 0) return;\n    if (old && HUMAN_COLS.indexOf(k) >= 0 && old[k] && old[k] !== 'FALSE') return;\n    // 段階は戻さない。人が進めた段階を、送り直しで前の段に戻さない（2026-10-02）\n    if (k === '段階' && old && CHOICES['段階'].indexOf(stageFix_(old['段階'])) > CHOICES['段階'].indexOf(c[k])) return;\n    row[k] = c[k];\n  });\n  row['段階'] = stageFix_(row['段階'] || '受付');\n  if (!row['保留']) row['保留'] = 'FALSE';\n  if (!row['主担当']) row['主担当'] = CASE_OWNER;\n  const folder = caseFolder_(id, row['所在地番']);\n  if (!row['フォルダ']) row['フォルダ'] = folder.getUrl();\n  if (!row['現地写真']) row['現地写真'] = photoFolder_(folder).getUrl();\n  if (b.check) row['照合の済'] = JSON.stringify(b.check);\n\n  // 敷地調査のやることは段階と同じ行にする。道具が送る前の形の工程は使わない（2026-10-02）\n  const stageTasks = row['区分'] !== '許認可';\n  if (Array.isArray(b.tasks) && !stageTasks) replaceTasks_(id, b.tasks);\n  if (Array.isArray(b.checks)) replaceChecks_(id, b.checks);\n  if (Array.isArray(b.fields)) replaceFields_(id, b.fields);\n  if (row['区分'] !== '許認可') ensureDelivery_(id);\n  row['人の確認（残り）'] = remainingLabel_(id);\n  row['更新日時'] = now_();\n  writeObj_('案件', { '案件番号': id }, row);\n  if (stageTasks) ensureStageTasks_(id);\n  addLog_(id, BY_TOOL, b.log || (old ? '案件のデータを受け取って書き直した' : '案件を受け付けた'));\n\n  let mailed = false;\n  if (row['段階'] === '人の目で確認' && (!old || stageFix_(old['段階']) !== '人の目で確認')) {\n    notify_(row);\n    mailed = true;\n  }\n  return { ok: true, '案件番号': id, folder: folder.getUrl(), mailed: mailed };\n}\n\n\n/** Claude（事務）から：お金の欄、納品の確認、事務のやることを書く（2026-10-24 本人「AIで入れていく情報をWebアプリに入れる」）。\n *  {案件番号, money:{見積|請求|入金: 文}, done:[確かめること…], task:{やること, 担当, 済, メモ, リンク, 分類}, log, who}\n *  ファイル（見積書・請求書のPDF）は action file の kind で置く。送信はしない（メールは人が送る） */\nconst BY_JIMU = 'Claude（事務）';\nfunction jimu_(b) {\n  const id = String(b['案件番号'] || '').trim();\n  const row = getCase_(id);\n  if (!row) throw new Error('案件が見つかりません：' + id);\n  const who = String(b.who || BY_JIMU);\n  const did = [];\n  Object.keys(b.money || {}).forEach(k => {\n    if (MONEY_COLS.indexOf(k) < 0) throw new Error('お金の欄にありません：' + k);\n    const v = String(b.money[k] == null ? '' : b.money[k]).trim();\n    if ((row[k] || '') === v) return;\n    row[k] = v;\n    did.push(k + 'を「' + (v || '空') + '」にした');\n  });\n  (b.done || []).forEach(t => {\n    const r = findRow_('人の確認', { '案件番号': id, '確かめること': String(t) });\n    if (r < 0) { ensureDelivery_(id); }\n    const r2 = findRow_('人の確認', { '案件番号': id, '確かめること': String(t) });\n    if (r2 < 0) throw new Error('確認の項目が見つかりません：' + t);\n    const o = rowObj_('人の確認', r2);\n    if (o['済'] === 'TRUE') return;\n    o['済'] = 'TRUE'; o['済にした人'] = who; o['済にした日時'] = now_();\n    writeRow_('人の確認', r2, o);\n    did.push('確認を済にした：' + t);\n  });\n  if (b.task && String(b.task['やること'] || '').trim()) {\n    const t = b.task, name = String(t['やること']).trim();\n    const r = findRow_('やること', { '案件番号': id, 'やること': name });\n    const o = r > 0 ? rowObj_('やること', r) : { '案件番号': id, 'やること': name, '足した人': BY_JIMU, '分類': 'その他', '済': 'FALSE' };\n    TASK_EDITABLE.forEach(k => { if (t[k] !== undefined && t[k] !== null) o[k] = String(t[k]); });\n    if (o['担当']) o['担当'] = nameFix_(o['担当']);\n    o['済'] = bool_(o['済']);\n    if (o['済'] === 'TRUE' && !o['済んだ日']) o['済んだ日'] = today_();\n    if (o['済'] !== 'TRUE') o['済んだ日'] = '';\n    if (r > 0) writeRow_('やること', r, o);\n    else {\n      const nums = readAll_('やること').filter(x => x['案件番号'] === id).map(x => Number(x['番号']) || 0);\n      o['番号'] = (nums.length ? Math.max.apply(null, nums) : 0) + 1;\n      appendObjs_('やること', [o]);\n    }\n    did.push('やること「' + name + '」' + (o['済'] === 'TRUE' ? 'を済にした' : 'を書いた'));\n  }\n  row['人の確認（残り）'] = remainingLabel_(id);\n  row['更新日時'] = now_();\n  writeObj_('案件', { '案件番号': id }, row);\n  addLog_(id, who, b.log || did.join('。') || '事務の記録を受け取った');\n  return { ok: true, '案件番号': id, did: did, case: getCase_(id) };\n}\n\n/** 照合表の根拠の欄に、リンクだけを書き込む：{案件番号, links:[{欄, 項目, col, url, label}]}（2026-10-02）。\n *  報告書を作り直さないので、人が入れた済とメモは消えない。col は 6〜8（F〜H。根拠1〜3）。\n *  行は、照合表の「欄」（C列）の名前で探し、なければ隠しシート「_照合」の項目の番号で探す */\nfunction setLinks_(b) {\n  const id = String(b['案件番号'] || '').trim();\n  const row = getCase_(id);\n  if (!row) throw new Error('案件が見つかりません：' + id);\n  const m = /\\/d\\/([\\w-]+)/.exec(row['報告書'] || '');\n  if (!m) throw new Error('報告書のスプレッドシートがまだありません');\n  const book = SpreadsheetApp.openById(m[1]);\n  const sh = book.getSheetByName('照合表');\n  if (!sh) throw new Error('報告書に照合表が見つかりません');\n  const vals = sh.getDataRange().getValues();\n  const hr = vals.findIndex(r => r[0] === '番号');\n  const byLabel = {}, byItem = {};\n  vals.forEach((r, i) => { if (i > hr && r[2]) byLabel[String(r[2]).trim()] = i + 1; });\n  const hid = book.getSheetByName('_照合');\n  if (hid) hid.getDataRange().getValues().slice(1).forEach(r => { if (r[2] && r[4]) byItem[String(r[2])] = Number(r[4]); });\n  let n = 0;\n  const missing = [];\n  (b.links || []).forEach(L => {\n    const r = byLabel[String(L['欄'] || '').trim()] || byItem[String(L['項目'] || '')];\n    const col = Number(L.col) || 6;\n    if (!r || col < 6 || col > 8 || !/^https:\\/\\//.test(String(L.url || ''))) { missing.push(L['欄'] || L['項目'] || '?'); return; }\n    const label = String(L.label || '根拠を開く');\n    sh.getRange(r, col).setRichTextValue(SpreadsheetApp.newRichTextValue().setText(label).setLinkUrl(String(L.url)).build());\n    n++;\n  });\n  if (n) addLog_(id, BY_TOOL, '照合表の根拠にリンクを入れた：' + n + '件（報告書は作り直していない）');\n  return { ok: true, set: n, missing: missing };\n}\n\n/** 照合の色を付け直す：{案件番号}。案件のフォルダのスプレッドシートのうち、照合表のあるものすべて。\n *  送り直さないので、照合表に書いた済やメモは消えない（2026-10-01） */\nfunction recolor_(b) {\n  const id = String(b['案件番号'] || '').trim();\n  const row = getCase_(id);\n  if (!row) throw new Error('案件が見つかりません：' + id);\n  const it = caseFolder_(id, row['所在地番']).getFilesByType(MimeType.GOOGLE_SHEETS);\n  const done = [];\n  while (it.hasNext()) {\n    const f = it.next();\n    if (decorateCheck_(f.getId()) === 'ok') done.push(f.getName());\n  }\n  addLog_(id, BY_TOOL, '照合の色を付け直した：' + (done.join('、') || 'なし'));\n  return { ok: true, files: done };\n}\n\n/** ファイル1本：{案件番号, name, mime, data(base64), kind} */\nfunction receiveFile_(b) {\n  const id = String(b['案件番号'] || '').trim();\n  const row = getCase_(id);\n  if (!row) throw new Error('先に案件を送ってください：' + id);\n  if (!b.data) throw new Error('ファイルの中身がありません');\n  const base = caseFolder_(id, row['所在地番']);\n  // 根拠の資料は、案件のフォルダの中の小分けのフォルダに置く（2026-10-02 本人「ドライブに保存して、スプレッドシートにリンクを残す」）\n  const sub = String(b.sub || '').replace(/[\\\\/:*?\"<>|]/g, '_').trim();\n  const folder = sub ? subFolder_(base, sub) : base;\n  const name = String(b.name || 'file.pdf').replace(/[\\\\/:*?\"<>|]/g, '_');\n  const same = folder.getFilesByName(name);\n  while (same.hasNext()) same.next().setTrashed(true);   // 同じ名前の古い版はゴミ箱へ（戻せる）\n  const bytes = Utilities.base64Decode(b.data);\n  let f;\n  if (b.convert && /\\.xlsx$/i.test(name)) {\n    // Excel を Googleスプレッドシートに変えて置く（2026-09-28 本人「最初から本物のスプレッドシートに」）\n    const gname = name.replace(/\\.xlsx$/i, '');\n    const olds = folder.getFilesByName(gname);\n    while (olds.hasNext()) olds.next().setTrashed(true);\n    f = xlsxToSheet_(folder, gname, bytes);\n    try { decorateCheck_(f.getId()); } catch (e) { addLog_(id, BY_TOOL, '照合の色とリンクを付けられなかった：' + e.message); }\n    if (b.kind === '報告書') {   // 置いたらすぐ照合表の済を数える（画面に 0／全部 と出す）\n      try { const n = countCheck_(f.getId()); if (n) row['照合の済'] = JSON.stringify(n); } catch (e) { /* 数えられなくても、置くことは続ける */ }\n    }\n  } else {\n    f = folder.createFile(Utilities.newBlob(bytes, b.mime || 'application/pdf', name));\n  }\n  if (LINK_COLS.indexOf(b.kind) >= 0) row[b.kind] = f.getUrl();\n  row['更新日時'] = now_();\n  writeObj_('案件', { '案件番号': id }, row);\n  addLog_(id, BY_TOOL, 'ファイルを置いた：' + name);\n  return { ok: true, url: f.getUrl() };\n}\n\n/**\n * 「やること」を入れかえる。入れかえるのは Claude Code が足した行だけ。人が足した行は残す。\n * 同じ「やること」の行なら、人が入れた済・担当・メモ・リンクを残す。\n */\nfunction replaceTasks_(id, items) {\n  const all = readAll_('やること');\n  const mine = all.filter(r => r['案件番号'] === id);\n  const before = {};\n  mine.filter(r => r['足した人'] === BY_TOOL).forEach(r => { before[r['やること']] = r; });\n  const keep = mine.filter(r => r['足した人'] !== BY_TOOL);\n  let next = Math.max(0, ...mine.map(r => Number(r['番号']) || 0)) + 1;\n  const used = {};\n  keep.forEach(r => { used[r['番号']] = true; });\n  const rows = items.map(it => {\n    const o = Object.assign({}, it, { '案件番号': id, '足した人': BY_TOOL });\n    if (o['担当']) o['担当'] = nameFix_(o['担当']);\n    const prev = before[o['やること']];\n    if (prev) {\n      o['番号'] = prev['番号'];\n      ['済', '済んだ日', '担当', 'メモ', 'リンク'].forEach(k => {\n        if (prev[k] && prev[k] !== 'FALSE' && (!o[k] || o[k] === 'FALSE' || k === '担当')) o[k] = prev[k];\n      });\n    }\n    if (!o['番号'] || used[o['番号']]) o['番号'] = next++;\n    used[o['番号']] = true;\n    o['済'] = bool_(o['済']);\n    return o;\n  });\n  deleteWhere_('やること', r => r['案件番号'] === id && r['足した人'] === BY_TOOL);\n  appendObjs_('やること', rows);\n}\n\n/** 人の確認を入れかえる。同じ項目なら、人がつけた済とメモを残す */\nfunction replaceChecks_(id, items) {\n  const before = {};\n  readAll_('人の確認').filter(r => r['案件番号'] === id).forEach(r => { before[r['確かめること']] = r; });\n  const rows = items.map((it, i) => {\n    const o = Object.assign({}, it, { '案件番号': id });\n    if (!o['番号']) o['番号'] = i + 1;\n    const prev = before[o['確かめること']];\n    if (prev) {\n      ['済', '済にした人', '済にした日時', 'メモ'].forEach(k => {\n        if (prev[k] && prev[k] !== 'FALSE' && (!o[k] || o[k] === 'FALSE')) o[k] = prev[k];\n      });\n    }\n    o['済'] = bool_(o['済']);\n    return o;\n  });\n  const keep = readAll_('人の確認').filter(r => r['案件番号'] === id && DELIVERY.indexOf(r['確かめること']) >= 0);\n  deleteWhere_('人の確認', r => r['案件番号'] === id);\n  let next = Math.max(0, ...rows.map(r => Number(r['番号']) || 0));\n  appendObjs_('人の確認', rows.concat(keep.filter(k => !rows.some(r => r['確かめること'] === k['確かめること'])).map(k => Object.assign(k, { '番号': ++next }))));\n}\n\n/** 報告書の納品の段で行う2つ（2026-10-02 本人「送ったら報告して、完了を押す」）。なければ足す。済やメモは残す */\nconst DELIVERY = ['報告書をクライアントに送る', '田中さんに「送りました」と報告する'];\nfunction ensureDelivery_(id) {\n  const mine = readAll_('人の確認').filter(r => r['案件番号'] === id);\n  const have = mine.map(r => r['確かめること']);\n  let no = Math.max(0, ...mine.map(r => Number(r['番号']) || 0));\n  const add = DELIVERY.filter(t => have.indexOf(t) < 0).map(t => ({ '案件番号': id, '番号': ++no, '重さ': '', '確かめること': t,\n    'いまの値と理由': '', 'どこで': '納品｜', '済': 'FALSE' }));\n  if (add.length) appendObjs_('人の確認', add);\n}\n\n/** 報告書の欄を入れかえる（道具の出力だけなので、人の値は持たない） */\nfunction replaceFields_(id, items) {\n  deleteWhere_('報告書の欄', r => r['案件番号'] === id);\n  appendObjs_('報告書の欄', items.map((it, i) => Object.assign({ '番号': i + 1 }, it, { '案件番号': id })));\n}\n\n/** 案件ごとのファイルを置く親フォルダ。スプレッドシートと同じ場所に「案件管理_案件ごとのファイル」を作る */\nfunction rootFolder_() {\n  const props = PropertiesService.getScriptProperties();\n  const rid = props.getProperty('ROOT_FOLDER_ID');\n  if (rid) {\n    try { return DriveApp.getFolderById(rid); } catch (e) { /* 消されていたら作り直す */ }\n  }\n  const parents = DriveApp.getFileById(ss_().getId()).getParents();\n  const parent = parents.hasNext() ? parents.next() : DriveApp.getRootFolder();\n  const root = parent.createFolder('案件管理_案件ごとのファイル');\n  props.setProperty('ROOT_FOLDER_ID', root.getId());\n  return root;\n}\n\n/** 案件ごとのフォルダ（なければ作る）。名前は「A-0001 所在地番」 */\nfunction caseFolder_(id, label) {\n  const root = rootFolder_();\n  const it = root.getFolders();\n  while (it.hasNext()) {\n    const f = it.next();\n    if (f.getName() === id || f.getName().indexOf(id + ' ') === 0) return f;\n  }\n  return root.createFolder(label ? id + ' ' + label : id);\n}\n\n/** 現地写真のフォルダ（なければ作る）。中に「現況」と「境界」（今までの成果品の写真帳の2冊に合わせた。2026-10-01） */\nfunction photoFolder_(caseFolder) {\n  const find = (parent, name) => { const it = parent.getFoldersByName(name); return it.hasNext() ? it.next() : parent.createFolder(name); };\n  const f = find(caseFolder, '現地写真');\n  find(f, '現況'); find(f, '境界');\n  return f;\n}\n\n/** 案件のフォルダの中の小分けのフォルダ（なければ作る）。根拠の資料など */\nfunction subFolder_(parent, name) {\n  const it = parent.getFoldersByName(name);\n  return it.hasNext() ? it.next() : parent.createFolder(name);\n}\n\n/** 照合表の済を数える：{done, total, secs:{紙のシート:[済, 全部]}}。照合表のある報告書を開いて読む */\nfunction countCheck_(fileId) {\n  const chk = SpreadsheetApp.openById(fileId).getSheetByName('照合表');\n  if (!chk) return null;\n  const all = chk.getDataRange().getValues();\n  const hr = all.findIndex(r => r[0] === '番号');\n  if (hr < 0) return null;\n  const out = { done: 0, total: 0, secs: {} };\n  all.slice(hr + 1).forEach(r => {\n    if (!r[0] && !r[2]) return;\n    const sec = String(r[1] || 'その他'), ok = r[CHECK_DONE_COL - 1] === true || String(r[CHECK_DONE_COL - 1]).trim() === '済';\n    out.secs[sec] = out.secs[sec] || [0, 0];\n    out.secs[sec][1]++; out.total++;\n    if (ok) { out.secs[sec][0]++; out.done++; }\n  });\n  return out;\n}\n\n/** xlsx を Drive API（REST）で取り込み、Googleスプレッドシートにする。拡張サービスを入れなくても動くように UrlFetchApp を使う */\nfunction xlsxToSheet_(folder, name, bytes) {\n  const boundary = 'b' + Utilities.getUuid().replace(/-/g, '');\n  const meta = { name: name, mimeType: 'application/vnd.google-apps.spreadsheet', parents: [folder.getId()] };\n  const head = '--' + boundary + '\\r\\nContent-Type: application/json; charset=UTF-8\\r\\n\\r\\n' + JSON.stringify(meta) +\n    '\\r\\n--' + boundary + '\\r\\nContent-Type: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet\\r\\n\\r\\n';\n  const tail = '\\r\\n--' + boundary + '--';\n  const payload = Utilities.newBlob(head).getBytes().concat(bytes).concat(Utilities.newBlob(tail).getBytes());\n  const res = UrlFetchApp.fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {\n    method: 'post', contentType: 'multipart/related; boundary=' + boundary, payload: payload,\n    headers: { Authorization: 'Bearer ' + ScriptApp.getOAuthToken() }, muteHttpExceptions: true,\n  });\n  if (res.getResponseCode() !== 200) throw new Error('スプレッドシートに変えられませんでした：' + res.getContentText().slice(0, 200));\n  return DriveApp.getFileById(JSON.parse(res.getContentText()).id);\n}\n\n/** 照合の色（照合表のB3のチェックで出し入れ）と「欄へ飛ぶ」リンクを付ける（2026-09-29 本人「一々消すのはダルい」）。\n *  報告書には色を直接塗らない。条件付き書式が 照合表!B3 と、その項目の「済」（J列のチェック）を見る。\n *  B3にチェックがあり、済にチェックがない欄だけ色を出す（2026-10-01 本人「個別に色を外したい」）。\n *  何度呼んでもよい：前に付けた照合の書式は外してから付け直す。済の「済」の字はチェックに置き換える */\nconst CHECK_COLOR = { '一致': '#E2F0D9', '1出典': '#DDEBF7', '窓口確認': '#FFF2CC', '食い違い': '#F8CBAD', '未取得': '#FCE4D6' };\nconst CHECK_DONE_COL = 10;   // 照合表の「済」の列（J）\nfunction decorateCheck_(fileId) {\n  const ss = SpreadsheetApp.openById(fileId);\n  const hid = ss.getSheetByName('_照合'), chk = ss.getSheetByName('照合表');\n  if (!hid || !chk) return '';\n  chk.getRange('B3').insertCheckboxes();\n  if (chk.getRange('B3').getValue() === '') chk.getRange('B3').setValue(true);\n  // 見出しの行（A列が「番号」）より下が項目の行\n  const all = chk.getDataRange().getDisplayValues();\n  const hr = all.findIndex(r => r[0] === '番号') + 1;\n  if (!hr) return '';\n  const last = chk.getLastRow();\n  // 「済」の列をチェックボックスにする（前の版で「済」と書いた行はチェック済みにする）\n  if (last > hr) {\n    const done = chk.getRange(hr + 1, CHECK_DONE_COL, last - hr, 1);\n    const vals = done.getValues().map(r => [r[0] === true || String(r[0]).trim() === '済']);\n    done.clearDataValidations();\n    done.insertCheckboxes();\n    done.setValues(vals);\n  }\n  // 項目 → 照合表の行。_照合のE列（照合表の行）があればそれを使い、なければ「欄へ飛ぶ」の文字で探す\n  const jump = {};\n  all.forEach((r, i) => { if (i >= hr && r[11]) jump[r[11]] = i + 1; });\n  const rowOf = {};\n  const rows = hid.getDataRange().getValues().slice(1);\n  rows.forEach(([t, rg, iid, st, cr]) => {\n    if (!iid || rowOf[iid]) return;\n    rowOf[iid] = Number(cr) || jump['→ ' + t + ' ' + String(rg).split(':')[0]] || 0;\n  });\n  // 報告書のシートごと・項目ごとに1本の書式（済の行が項目ごとに違うため）\n  const bySheet = {};\n  rows.forEach(([t, rg, iid, st]) => {\n    if (!t || !rg || !CHECK_COLOR[st] || !rowOf[iid]) return;\n    const key = iid + '\\t' + st;\n    bySheet[t] = bySheet[t] || {};\n    (bySheet[t][key] = bySheet[t][key] || []).push(String(rg));\n  });\n  const isOurs = r => {\n    const c = r.getBooleanCondition();\n    return c && String((c.getCriteriaValues() || [])[0] || '').indexOf('照合表!') >= 0;\n  };\n  ss.getSheets().forEach(sh => {\n    const t = sh.getName();\n    if (t === '_照合') return;\n    const rules = sh.getConditionalFormatRules().filter(r => !isOurs(r));\n    if (t === '照合表' && last > hr) {\n      // 済にチェックした行は、照合表の中でも灰色にして字を薄くする\n      rules.push(SpreadsheetApp.newConditionalFormatRule()\n        .whenFormulaSatisfied('=INDIRECT(\"照合表!$J\"&ROW())=TRUE')\n        .setBackground('#EDEDED').setFontColor('#808080')\n        .setRanges([chk.getRange(hr + 1, 1, last - hr, 12)]).build());\n    }\n    Object.keys(bySheet[t] || {}).forEach(key => {\n      const [iid, st] = key.split('\\t');\n      rules.push(SpreadsheetApp.newConditionalFormatRule()\n        .whenFormulaSatisfied('=AND(INDIRECT(\"照合表!$B$3\")=TRUE,INDIRECT(\"照合表!$J$' + rowOf[iid] + '\")<>TRUE)')\n        .setBackground(CHECK_COLOR[st])\n        .setRanges(bySheet[t][key].map(a => sh.getRange(a))).build());\n    });\n    sh.setConditionalFormatRules(rules);\n  });\n  // 「欄へ飛ぶ」（12列目）：「→ シート名 A1」を、同じスプレッドシートの中へのリンクにする\n  const gid = {};\n  ss.getSheets().forEach(s => { gid[s.getName()] = s.getSheetId(); });\n  const n = chk.getLastRow();\n  chk.getRange(1, 12, n, 1).getValues().forEach((v, i) => {\n    const m = /^→ (.+) ([A-Z]+\\d+)$/.exec(String(v[0] || ''));\n    if (!m || gid[m[1]] === undefined) return;\n    chk.getRange(i + 1, 12).setFormula('=HYPERLINK(\"#gid=' + gid[m[1]] + '&range=' + m[2] + '\",\"→ ' + m[1] + ' ' + m[2] + '\")');\n  });\n  hid.hideSheet();\n  return 'ok';\n}\n\n/** 人の目で確認の段階に入ったら、担当へメール。照合表の残りと、窓口で聞くことの★の数 */\nfunction notify_(row) {\n  const props = PropertiesService.getScriptProperties();\n  const to = props.getProperty('NOTIFY_TO') || Session.getEffectiveUser().getEmail();\n  const checks = readAll_('人の確認').filter(r => r['案件番号'] === row['案件番号'] && r['済'] !== 'TRUE' && DELIVERY.indexOf(r['確かめること']) < 0);\n  const stars = checks.filter(r => r['重さ'] === '★').length;\n  const first = checks.filter(r => r['重さ'] === '★')[0] || checks[0];\n  const url = props.getProperty('APP_URL') || '';\n  const lines = [\n    row['案件番号'] + '（' + row['区分'] + '、' + row['自治体'] + '）の役所調査のたたき台ができました。',\n    '照合表を開いて、根拠を確かめてください。',\n    '',\n    '窓口と現地で確かめることは ' + checks.length + ' 件です。そのうち★は ' + stars + ' 件です。',\n    first ? 'いちばん先に確かめること：' + first['確かめること'] : null,\n    row['期日'] ? '期日：' + row['期日'] : null,\n    '',\n    url ? '画面：' + url : '（画面のURLは、スクリプトのプロパティ APP_URL に入れると、ここに出ます）',\n  ].filter(s => s !== null);\n  MailApp.sendEmail({\n    to: to,\n    subject: '【照合待ち】' + row['案件番号'] + ' ★' + stars,\n    body: lines.join('\\n'),\n    name: '案件管理',\n  });\n  addLog_(row['案件番号'], '案件管理', '確認待ちのメールを送った（★' + stars + '）');\n}\n\n// ─────────────────────────────────────────────\n// 画面から呼ぶ（google.script.run）\n// ─────────────────────────────────────────────\n\nfunction getAll() {\n  requireMember_();\n  fixNames_();\n  fixStageTasks_();\n  const logs = readAll_('記録');\n  return {\n    today: Utilities.formatDate(new Date(), TZ, 'yyyy-MM-dd'),\n    me: Session.getActiveUser().getEmail(),\n    choices: CHOICES,\n    stageNote: STAGE_NOTE,\n    stageOwner: stageOwners_(),\n    intakeTo: intakeTo_(),\n    camera: CAMERA_URL,\n    guide: readAll_('手引き'),\n    names: names_(),\n    cases: readAll_('案件').map(c => Object.assign(c, { '段階': stageFix_(c['段階']) })),\n    tasks: readAll_('やること'),\n    checks: readAll_('人の確認'),\n    fields: readAll_('報告書の欄'),\n    logs: logs.slice(-400).reverse(),\n  };\n}\n\n/** 照合表の済を読み直して、案件の「照合の済」に書く（案件の画面の「照合表から読み直す」） */\nfunction refreshCheck(id) {\n  const who = requireMember_();\n  return withLock_(() => {\n    const row = getCase_(id);\n    if (!row) throw new Error('案件が見つかりません：' + id);\n    const m = /\\/d\\/([\\w-]+)/.exec(row['報告書'] || '');\n    if (!m) throw new Error('報告書のスプレッドシートがまだありません');\n    const n = countCheck_(m[1]);\n    if (!n) throw new Error('報告書に照合表が見つかりません');\n    const before = row['照合の済'];\n    row['照合の済'] = JSON.stringify(n);\n    if (before !== row['照合の済']) {\n      row['更新日時'] = now_();\n      writeObj_('案件', { '案件番号': id }, row);\n      addLog_(id, who, '照合表の済を読み直した：' + n.done + '／' + n.total);\n    }\n    return getAll();\n  });\n}\n\n/** 案件を消す（2026-10-02 本人「間違って作った案件を消したい」）。案件・やること・確認・報告書の欄の行を消す。\n *  ドライブのフォルダとファイルは消さない（あとから戻せるように）。記録には残す */\nfunction removeCase_(id, who) {\n  const row = getCase_(id);\n  if (!row) throw new Error('案件が見つかりません：' + id);\n  ['やること', '人の確認', '報告書の欄'].forEach(n => deleteWhere_(n, r => r['案件番号'] === id));\n  deleteWhere_('案件', r => r['案件番号'] === id);\n  addLog_(id, who, '案件を消した（' + (row['区分'] || '') + '、' + (row['所在地番'] || '') + '）。ドライブのフォルダは残した');\n  return { ok: true, removed: id };\n}\nfunction removeCase(id) {\n  const who = requireMember_();\n  return withLock_(() => { removeCase_(id, who); return getAll(); });\n}\n\n/** 案件を画面から足す（Claude Code を通さない案件。建物・確定測量など） */\nfunction addCase(fields) {\n  const who = requireMember_();\n  return withLock_(() => {\n    const f = fields || {};\n    if (!String(f['所在地番'] || '').trim()) throw new Error('所在地番を入れてください');\n    const nums = readAll_('案件').map(r => (/^A-(\\d+)$/.exec(r['案件番号']) || [])[1]).filter(Boolean).map(Number);\n    const id = 'A-' + ('000' + ((nums.length ? Math.max.apply(null, nums) : 0) + 1)).slice(-4);\n    const row = { '案件番号': id, '受付日': today_(), '段階': '受付', '保留': 'FALSE', '更新日時': now_() };\n    EDITABLE.forEach(k => { if (f[k] !== undefined && f[k] !== '') row[k] = String(f[k]); });\n    if (!row['主担当']) row['主担当'] = CASE_OWNER;\n    row['人の確認（残り）'] = '0';\n    writeObj_('案件', { '案件番号': id }, row);\n    addLog_(id, who, '画面から案件を足した');\n    const d = getAll();\n    d.opened = id;\n    return d;\n  });\n}\n\n/** 案件の列を変える。変えてよい列だけ */\nfunction updateCase(id, patch) {\n  const who = requireMember_();\n  return withLock_(() => {\n    const row = getCase_(id);\n    if (!row) throw new Error('案件が見つかりません：' + id);\n    const changed = [];\n    Object.keys(patch || {}).forEach(k => {\n      if (EDITABLE.indexOf(k) < 0) return;\n      let v = patch[k] === null || patch[k] === undefined ? '' : String(patch[k]);\n      if (k === '保留') v = bool_(v);\n      if (k === '主担当') v = nameFix_(v);\n      if (k === '段階') v = stageFix_(v);\n      if (k === '段階' && CHOICES['段階'].indexOf(v) < 0) throw new Error('段階が選択肢にありません：' + v);\n      if (k === '段階' && v === '完了' && row['区分'] !== '許認可') {\n        ensureDelivery_(id);\n        const left = readAll_('人の確認').filter(r => r['案件番号'] === id && DELIVERY.indexOf(r['確かめること']) >= 0 && r['済'] !== 'TRUE');\n        if (left.length) throw new Error('完了にする前に、済にしてください：' + left.map(r => r['確かめること']).join('、'));\n      }\n      if (k === '段階' && v === '報告書の納品') ensureDelivery_(id);\n      if ((row[k] || '') === v) return;\n      if (k === 'メモ') changed.push('メモを書きかえた');\n      else if (k === '保留') changed.push(v === 'TRUE' ? '保留にした' : '保留をといた');\n      else changed.push(k + 'を「' + (row[k] || '空') + '」から「' + (v || '空') + '」にした');\n      row[k] = v;\n    });\n    if (changed.length) {\n      row['更新日時'] = now_();\n      writeObj_('案件', { '案件番号': id }, row);\n      addLog_(id, who, changed.join('。'));\n      if ('段階' in (patch || {})) { if (row['区分'] === '許認可') syncTasks_(id, row['段階']); else ensureStageTasks_(id); }\n    }\n    return getAll();\n  });\n}\n\n/** 段階に合わせて、工程（やること）の済をそろえる（2026-10-02 本人「段階の帯でチェックして完了にしたい」）。\n *  今の段階より前の段の行は済、今の段階とそれより後は済をはずす。段の名前を含まない行は触らない */\nconst TASK_STAGE = [['受付', '受付'], ['たたき台', 'たたき台の作成'], ['人の目', '人の目で確認'], ['窓口', '窓口で確認'],\n  ['現地', '現地調査'], ['最終', '最終チェック'], ['納品', '報告書の納品']];\nfunction syncTasks_(id, stage) {\n  const st = CHOICES['段階'], cur = st.indexOf(stage);\n  const sh = sh_('やること'), cols = SHEETS['やること'];\n  readAll_('やること').forEach((t, i) => {\n    if (t['案件番号'] !== id) return;\n    const hit = TASK_STAGE.find(([k]) => String(t['やること']).indexOf(k) >= 0);\n    if (!hit) return;\n    const want = st.indexOf(hit[1]) < cur ? 'TRUE' : 'FALSE';\n    if (t['済'] === want) return;\n    t['済'] = want; t['済んだ日'] = want === 'TRUE' ? today_() : '';\n    writeRow_('やること', i + 2, t);\n  });\n}\n\n/** やることを足す */\nfunction addTask(id, t) {\n  const who = requireMember_();\n  return withLock_(() => {\n    if (!getCase_(id)) throw new Error('案件が見つかりません：' + id);\n    const o = {};\n    TASK_EDITABLE.forEach(k => { if (t && t[k] !== undefined) o[k] = String(t[k]); });\n    if (o['担当']) o['担当'] = nameFix_(o['担当']);\n    if (!String(o['やること'] || '').trim()) throw new Error('やることを入れてください');\n    if (o['開始日'] && o['終了日'] && o['終了日'] < o['開始日']) throw new Error('終わりの日が、始まりの日より前です');\n    const nums = readAll_('やること').filter(r => r['案件番号'] === id).map(r => Number(r['番号']) || 0);\n    o['案件番号'] = id;\n    o['番号'] = (nums.length ? Math.max.apply(null, nums) : 0) + 1;\n    o['済'] = bool_(o['済']);\n    o['足した人'] = who;\n    appendObjs_('やること', [o]);\n    touch_(id);\n    addLog_(id, who, 'やることを足した：' + o['やること'] + (o['担当'] ? '（' + o['担当'] + '）' : ''));\n    return getAll();\n  });\n}\n\n/** やることを変える（済・担当・日付・メモ・リンク） */\nfunction updateTask(id, no, patch) {\n  const who = requireMember_();\n  return withLock_(() => {\n    const r = findRow_('やること', { '案件番号': id, '番号': String(no) });\n    if (r < 0) throw new Error('やることが見つかりません');\n    const o = rowObj_('やること', r);\n    const changed = [];\n    Object.keys(patch || {}).forEach(k => {\n      if (TASK_EDITABLE.indexOf(k) < 0) return;\n      let v = patch[k] === null || patch[k] === undefined ? '' : String(patch[k]);\n      if (k === '済') v = bool_(v);\n      if (k === '担当') v = nameFix_(v);\n      if ((o[k] || '') === v) return;\n      if (k === '済') { o['済んだ日'] = v === 'TRUE' ? today_() : ''; changed.push(v === 'TRUE' ? '済にした' : '済をはずした'); }\n      else if (k === 'メモ' || k === 'リンク') changed.push(k + 'を書きかえた');\n      else changed.push(k + 'を「' + (o[k] || '空') + '」から「' + (v || '空') + '」にした');\n      o[k] = v;\n    });\n    if (o['開始日'] && o['終了日'] && o['終了日'] < o['開始日']) throw new Error('終わりの日が、始まりの日より前です');\n    if (changed.length) {\n      writeR const KIND_OLD = { '事務所': '窓口', '資格者': '最終チェック', '判断': '最終チェック', 'いちばん先に窓口': '窓口', '現地・資料': '現地', '資料': '窓口' };

const whereOf = q => { let [k, p] = String(q['どこで'] || '').split('｜'); k = KIND_OLD[k] || k; return { k: KINDS.some(x => x.k === k) ? k : '窓口', p: p || '' }; };
const checkOf = c => { try { return JSON.parse(c['照合の済'] || ''); } catch (e) { return null; } };

function fieldState(f, qs) {

function stageBoxes(c) {
  const id = c['案件番号'], qs = checksOf(id), fs = fieldsOf(id), st = S.data.choices['段階'], cur = st.indexOf(c['段階']);
  return KINDS.map(K => {
    const ks = qs.filter(q => whereOf(q).k === K.k);
    const left = ks.filter(q => q['済'] !== 'TRUE');
    const owner = ownerOfStage(c, K.stage);
    const later = st.indexOf(K.stage) > cur;
    const vt = stageTaskOf(c, K.stage);
    // 行く人と行く日（2026-10-24 本人「誰がいつそこに行くのかを明確に」。決めるのは田中さん）
    const visit = (K.k === '窓口' || K.k === '現地') && vt ? '<div class="visit"><span class="k">' + (K.k === '窓口' ? '窓口へ行く人' : '現地へ行く人') + '</span>' +
      pickHtml('data-vwho', vt['担当'], PEOPLE().filter(n => n !== 'Claude Code')).replace(/data-vwho="/g, 'data-vwho="' + esc(K.stage) + '|') +
      '<span class="k">行く日</span><input type="date" data-vday="' + esc(K.stage) + '" value="' + esc(vt['開始日'] || '') + '">' +
      '<span class="k">決めた人と日は、カレンダーに出ます</span></div>' : '';

    const tools = (K.k === '窓口' ? (c['役所調査ガイド'] ? '<a class="photo" href="' + esc(c['役所調査ガイド']) + '" target="_blank" rel="noopener">' + ic('報告書', 's') + '役所調査ガイドを開く（印刷して持っていく）</a>'

      ((K.k === '窓口' || K.k === '現地') && S.data.camera ? '<a class="photo" href="' + esc(S.data.camera) + '" target="_blank" rel="noopener">' + ic('現地写真', 's') + '名前つきカメラを開く</a>' : '');
    const toolsHtml = tools ? '<div class="tools">' + tools + '</div>' : '';
    const photo = K.k === '現地' ? (c['現地写真'] ? '<div><a class="photo" href="' + esc(c['現地写真']) + '" target="_blank" rel="noopener">' + ic('現地写真', 's') + '現地写真を入れる（現況・境界）</a></div>' : '<p class="lbl">現地写真のフォルダは、まだありません</p>') : '';
    const kyoka = K.k === '納品' ? kyokaBox(c) : '';
    return '<section class="sheet stagebox' + (later ? ' later' : '') + '"><h3 style="align-items:center">' + ic(K.stage) + esc(K.title) + whoTag(owner) +
      '<button class="guide-btn" data-guide="' + esc(K.stage) + '">手引き</button>' +
      '<span class="cnt">' + (ks.length ? (left.length ? '残り<b>' + left.length + '</b>／' + ks.length : '<b>済</b>') : '') + '</span></h3>' +
      '<p class="lead">' + esc(K.sub) + '</p>' + visit + toolsHtml + photo +
      (ks.length ? '<ul class="go" style="border:none;padding:0">' + ks.map(q => qItem(q, fs)).join('') + '</ul>' : '<p class="lbl">この段で確かめることはありません</p>') +
      kyoka + '</section>';
  }).join('');
}

};/*/ICONS*/
const ic = (k, cls) => ICONS[k] ? '<img class="ic ' + (cls || '') + '" src="' + ICONS[k] + '" alt="">' : '';
const TASK_IC = { '受付': '受付', 'たたき台': 'たたき台の作成', '人の目': '人の目で確認', '窓口': '窓口で確認', '現地': '現地調査', '最終': '最終チェック', '納品': '報告書の納品', '完了': '完了' };
const deliveryLeft = c => checksOf(c['案件番号']).filter(q => whereOf(q).k === '納品' && q['済'] !== 'TRUE').length;
const taskIcon = t => { const n = String(t['やること'] || ''); const k = Object.keys(TASK_IC).find(x => n.indexOf(x) >= 0); return k ? ic(TASK_IC[k], 's') : ''; };
// 現在の担当＝今の段階の担当（担当はみんな。案件ごとの「主担当」は置かない。2026-10-01 本人）
const turnOf = c => { const t = stageTask(c); return (t && t['担当']) || (S.data.stageOwner || {})[c['段階']] || ''; };
const ownerOfStage = (c, stage) => { const t = tasksOf(c['案件番号']).find(x => String(x['やること']).replace(/（[^）]*）$/, '') === stage); return (t && t['担当']) || (S.data.stageOwner || {})[stage] || ''; };
const stageTaskOf = (c, stage) => tasksOf(c['案件番号']).find(x => String(x['やること']).replace(/（[^）]*）$/, '') === stage);
// お願いできる人（ボタンで選ぶ。Claude Code と行政書士法人は段階の行では選ばない）
const PEOPLE = () => (S.data.choices['担当'] || []).filter(n => n !== '行政書士法人');
const pickHtml = (attr, cur, list) => '<span class="pick">' + (list || PEOPLE()).map(n => '<button ' + attr + '="' + esc(n) + '" class="' + (n === cur ? 'on' : '') + '">' + esc(n) + '</button>').join('') + '</span>';
const noMoney = c => ['報告書の納品', '完了'].indexOf(c['段階']) >= 0 && !String(c['請求'] || '').trim();
const whoTag = w => w ? '<span class="who">' + esc(w) + '</span>' : '<span class="who none">担当なし</span>';
const caseMatch = c => !S.q.trim() || Object.values(c).join(' ').includes(S.q.trim());
const linkHtml = (href, label) => href ? '<a href="' + esc(href) + '" target="_blank" rel="noopener">' + esc(label) + '</a>' : '';

// ── 上の帯 ──
function renderHead() {
  const ts = S.data.tasks.filter(t => !isDone(t) && caseOf(t['案件番号']));
  const late = ts.filter(isLate).length;
  const tdy = ts.filter(t => startOf(t) && startOf(t) <= today() && endOf(t) >= today()).length;
  const wait = S.data.cases.filter(c => c['段階'] === '人の目で確認').length;

// ── 工程表 ──
function renderGantt() {
  const cs = S.data.cases.filter(c => caseMatch(c) && (S.showDone || c['段階'] !== '完了'));
  const list = cs.map(c => ({ c, ts: tasksOf(c['案件番号']).filter(t => S.who === '全員' || t['担当'] === S.who) })).filter(x => x.ts.length);
  if (!list.length) return '<p class="empty">工程表に出すやることはありません</p>';
  const t0 = today();
  let lo = null, hi = null;
  list.forEach(x => x.ts.forEach(t => {
    const a = startOf(t), b = endOf(t);
    if (a && (!lo || a < lo)) lo = a;
    if (b && (!hi || b > hi)) hi = b;
  }));
  if (!lo) { lo = t0; hi = t0; }
  const five = S.scale === '5';
  // 見る幅：今日の7日前から。1日ごとは60日先まで、5日ごとは150日先まで
  let from = lo < addD(t0, -7) ? addD(t0, -7) : lo;
  let to = hi > addD(t0, five ? 150 : 60) ? addD(t0, five ? 150 : 60) : (hi < addD(t0, 14) ? addD(t0, 14) : hi);
  const cs_ = getComputedStyle(document.documentElement);
  const L = parseInt(cs_.getPropertyValue('--L')), W = parseInt(cs_.getPropertyValue('--W'));
  let px, head = '', bg = '', width;
  if (!five) {
    const n = days(from, to) + 1;
    width = n * W;
    px = d => days(from, d) * W;
    for (let i = 0; i < n; i++) {
      const d = addD(from, i), w = d.getDay(), isT = days(t0, d) === 0;
      const cls = isT ? 'today' : w === 6 ? 'sat' : w === 0 ? 'sun' : '';
      if (cls) bg += '<div class="g-bg ' + cls + '" style="left:' + (L + i * W) + 'px;width:' + W + 'px"></div>';
      head += '<div class="g-day ' + (w === 6 ? 'sat ' : w === 0 ? 'sun ' : '') + (isT ? 'today' : '') + '" style="left:' + (i * W) + 'px;width:' + W + 'px">' +
        (i === 0 || d.getDate() === 1 ? (d.getMonth() + 1) + '月' : WD[w]) + '<b>' + d.getDate() + '</b></div>';
    }
  } else {
    // 5日ごと：月の1・6・11・16・21・26日で区切る（26日からは月末まで）
    const B = 48;
    const blockStart = d => new Date(d.getFullYear(), d.getMonth(), d.getDate() >= 26 ? 26 : Math.floor((d.getDate() - 1) / 5) * 5 + 1);
    const nextBlock = s => s.getDate() === 26 ? new Date(s.getFullYear(), s.getMonth() + 1, 1) : addD(s, 5);
    const blocks = [];
    for (let s = blockStart(from); s <= to; s = nextBlock(s)) blocks.push(s);
    from = blocks[0];
    to = addD(nextBlock(blocks[blocks.length - 1]), -1);
    width = blocks.length * B;
    px = d => {
      if (d > to) return width;
      let i = blocks.length - 1;
      while (i > 0 && blocks[i] > d) i--;
      return i * B + days(blocks[i], d) / days(blocks[i], nextBlock(blocks[i])) * B;
    };
    blocks.forEach((s, i) => {
      head += '<div class="g-day" style="left:' + (i * B) + 'px;width:' + B + 'px">' + (i === 0 || s.getDate() === 1 ? (s.getMonth() + 1) + '月' : '&nbsp;') + '<b>' + s.getDate() + '</b></div>';
      bg += '<div class="g-bg blk" style="left:' + (L + i * B) + 'px;width:' + B + 'px"></div>';
    });
    bg += '<div class="g-bg todayline" style="left:' + (L + px(t0)) + 'px"></div>';
  }
  const barPos = (a, b) => {
    const aa = a < from ? from : a, bb = b > to ? to : b;
    const x0 = px(aa), x1 = px(addD(bb, 1));
    return { x: x0 + 2, w: Math.max(8, x1 - x0 - 4) };
  };
  let rows = '<div class="g-row g-head" style="height:42px"><div class="g-label">案件とやること</div><div class="g-track" style="width:' + width + 'px">' + head + '</div></div>';
  list.forEach(({ c, ts }) => {
    const id = c['案件番号'], dd = D(c['期日']);
    const due = dd && dd >= from && dd <= to ? '<div class="bar due" title="期日 ' + md(dd) + '" style="left:' + (five ? px(dd) : px(dd) + W / 2 - 2) + 'px"></div>' : '';
    rows += '<div class="g-row g-case"><div class="g-label" data-open="' + esc(id) + '"><span class="num">' + esc(id) + '</span>' + esc(c['段階']) + '</div>' +
      '<div class="g-track" style="width:' + width + 'px"><span class="g-where">' + esc(c['所在地番']) + '（' + esc(c['区分']) + '）</span>' + due + '</div></div>';
    ts.forEach(t => {
      const a = startOf(t), b = endOf(t);
      let bar = '';
      if (a && b >= from && a <= to) {
        const cls = isDone(t) ? 'done' : isLate(t) ? 'late' : '';
        const p = barPos(a, b), who = t['担当'] || '', fits = p.w >= who.length * 12 + 12;
        bar = '<div class="bar ' + cls + '" data-case="' + esc(id) + '" data-no="' + esc(t['番号']) + '" title="' + esc(t['やること'] + '　' + (who || '担当なし') + '　' + span(t)) + '" style="left:' + p.x + 'px;width:' + p.w + 'px">' + (fits ? esc(who) : '') + '</div>' +
          (!fits && who ? '<span class="bar-name ' + cls + '" style="left:' + (p.x + p.w + 4) + 'px">' + esc(who) + '</span>' : '');
      }
      rows += '<div class="g-row"><div class="g-label ' + (isDone(t) ? 'done' : '') + '" data-case="' + esc(id) + '" data-no="' + esc(t['番号']) + '"><span class="t">' + esc(t['やること']) + '</span>' + whoTag(t['担当']) + '</div>' +
        '<div class="g-track" style="width:' + width + 'px">' + bar + '</div></div>';
    });
  });
  return '<div class="gantt"><div class="g-inner">' + bg + rows + '</div></div>' +
    '<div class="g-note"><span><i style="background:var(--key)"></i>これから</span><span><i style="background:#c9ced4"></i>済</span>' +
    '<span><i style="border:2px solid var(--done)"></i>予定の日を過ぎて済になっていない</span><span><i style="background:var(--ink);width:4px"></i>期日</span>' +
    (five ? '' : '<span><i style="background:var(--sat-wash)"></i>土曜</span><span><i style="background:var(--sun-wash)"></i>日曜</span>') +
    '<span>棒の中の名前が担当です。行を押すと、そのやることを開きます</span></div>';
}

// カレンダー（2026-10-24 本人「別の案件管理のカレンダーがいい」）。窓口と現地へ行く日と、納品の期日を出す
const VISIT = ['窓口で確認', '現地調査'];
function calEvents() {
  const ev = [];
  S.data.cases.forEach(c => {
    if (!caseMatch(c) || (!S.showDone && c['段階'] === '完了')) return;
    tasksOf(c['案件番号']).forEach(t => {
      const name = String(t['やること']).replace(/（[^）]*）$/, '');
      if (!S.calAll && VISIT.indexOf(name) < 0) return;
      if (!S.showDone && isDone(t)) return;
      if (S.who !== '全員' && t['担当'] !== S.who) return;
      const a = startOf(t), b = endOf(t);
      if (!a) return;
      for (let d = a; d <= b; d = addD(d, 1)) ev.push({ d: d, c: c, t: t, name: name });
    });
    const due = D(c['期日']);
    if (due && c['段階'] !== '完了') ev.push({ d: due, c: c, due: true });
  });
  return ev;
}
function renderCal() {
  const t0 = today();
  const m = S.month ? D(S.month + '-01') : new Date(t0.getFullYear(), t0.getMonth(), 1);
  const first = new Date(m.getFullYear(), m.getMonth(), 1), last = new Date(m.getFullYear(), m.getMonth() + 1, 0);
  const from = addD(first, -first.getDay()), to = addD(last, 6 - last.getDay());
  const ev = calEvents();
  const key = d => d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate();
  const by = {};
  ev.forEach(e => { (by[key(e.d)] = by[key(e.d)] || []).push(e); });
  let cells = '日月火水木金土'.split('').map((w, i) => '<div class="wd ' + (i === 0 ? 'sun' : i === 6 ? 'sat' : '') + '">' + w + '</div>').join('');
  for (let d = from; d <= to; d = addD(d, 1)) {
    const es = (by[key(d)] || []).sort((a, b) => (a.due ? 1 : 0) - (b.due ? 1 : 0));
    const out = d.getMonth() !== m.getMonth();
    cells += '<div class="d' + (out ? ' out' : '') + (es.length ? '' : ' empty') + (+d === +t0 ? ' today' : '') + (d.getDay() === 0 ? ' sun' : d.getDay() === 6 ? ' sat' : '') + '">' +
      '<span class="n">' + (d.getMonth() + 1) + '/' + d.getDate() + '（' + WD[d.getDay()] + '）</span>' +
      es.map(e => e.due
        ? '<button class="ev due" data-open="' + esc(e.c['案件番号']) + '"><b>納品の期日</b><span class="p">' + esc(e.c['案件番号'] + ' ' + (e.c['自治体'] || e.c['所在地番'] || '')) + '</span></button>'
        : '<button class="ev' + (e.t['担当'] ? '' : ' none') + (isDone(e.t) ? ' done' : '') + '" data-case="' + esc(e.c['案件番号']) + '" data-no="' + esc(e.t['番号']) + '"><b>' + esc(e.t['担当'] || '行く人が未定') + '</b>　' + esc(e.name === '窓口で確認' ? '窓口' : e.name === '現地調査' ? '現地' : e.name) +
          '<span class="p">' + esc(e.c['案件番号'] + ' ' + (e.c['自治体'] || e.c['所在地番'] || '')) + '</span></button>').join('') + '</div>';
  }
  const ym = m.getFullYear() + '-' + ('0' + (m.getMonth() + 1)).slice(-2);
  return '<div class="cal-head"><button class="btn sub small" data-mon="-1">前の月</button><h2>' + m.getFullYear() + '年' + (m.getMonth() + 1) + '月</h2>' +
    '<button class="btn sub small" data-mon="1">次の月</button><button class="btn sub small" data-mon="0">今月</button>' +
    '<span class="note">' + (S.calAll ? 'すべてのやることを出しています' : '窓口と現地へ行く日と、納品の期日を出しています') + '。予定を押すと、行く人と日を直せます</span></div>' +
    '<div class="cal" data-ym="' + ym + '">' + cells + '</div>';
}

    changeTask(id, t['番号'], { '担当': b.dataset.turn }, '「' + c['段階'] + '」を' + b.dataset.turn + 'さんにお願いしました');
  });
  $$('[data-vwho]').forEach(b => b.onclick = () => {
    const [stage, who] = b.dataset.vwho.split('|'), t = stageTaskOf(c, stage); if (!t || t['担当'] === who) return;
    changeTask(id, t['番号'], { '担当': who }, (stage === '窓口で確認' ? '窓口' : '現地') + 'へ行く人を' + who + 'さんにしました');
  });
  $$('[data-vday]').forEach(inp => inp.onchange = () => {
    const stage = inp.dataset.vday, t = stageTaskOf(c, stage); if (!t || !inp.value) return;
    const d = D(inp.value);
    changeTask(id, t['番号'], { '開始日': inp.value, '終了日': inp.value }, (stage === '窓口で確認' ? '窓口' : '現地') + 'へ行く日を' + md(d) + '（' + WD[d.getDay()] + '）にしました');
  });
}

$$('#tabs button').forEach(b => b.onclick = () => { S.view = b.dataset.v; S.caseId = null; S.modal = null; keepView(); render(); window.scrollTo(0, 0); });

if (window.__BOOT) { S.data = window.__BOOT; render(); }
else run('getAll').then(d => { S.data = d; render(); });
</script>
